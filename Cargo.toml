[workspace]
members = ["mem-core", "mem-cli", "mem-mcp"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Ship small binaries: `mem` and `mem-mcp` are installed on every device.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
