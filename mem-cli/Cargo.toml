[package]
name = "mem-cli"
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Jerry-Hang/acdm"
description = "CLI for Agent Cross-Device Memory System"

[[bin]]
name = "mem"
path = "src/main.rs"

[dependencies]
mem-core = { path = "../mem-core" }
clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
